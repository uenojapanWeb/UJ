function getTitle(x){

    let tags=(x["ハッシュタグ"]||"")
        .split("#")
        .map(v=>v.trim())
        .filter(v=>v);

    let ignore=["没入散歩"];

    let spot=tags.filter(v=>!ignore.includes(v));

    return spot.slice(0,3).join(" ・ ") || x["#"];
}

function createTags(x){

    let tags=(x["ハッシュタグ"]||"")
        .match(/#([^\s#]+)/g) || [];

    return tags.map(t=>
        `<span class="tag"
            onclick="searchTag('${t.replace('#','')}')">
            ${t}
        </span>`
    ).join('');
}

function calcScore(x){

    let views=parseFloat(x.views)||0;
    let likes=parseFloat(x.likes)||0;
    let comments=parseFloat(x.comments)||0;
    let shares=parseFloat(x.shares)||0;

    return (likes*3)+(comments*5)+(shares*10)+(views/100);
}

function searchTag(tag){

    document.getElementById("q").value=tag;
    draw(tag);
}

function draw(keyword=''){

    let rows=data.filter(x=>
        JSON.stringify(x)
        .toLowerCase()
        .includes(keyword.toLowerCase())
    );

    rows.sort((a,b)=>
        calcScore(b)-calcScore(a)
    );

    document.getElementById("count").innerHTML=
        `検索結果 ${rows.length} 件`;

    let h='';

    rows.forEach(x=>{

        let title=getTitle(x);

        h+=`
        <div class="spot-card">

            <div class="spot-title">
                ${title}
            </div>

            <div class="spot-tags">
                ${createTags(x)}
            </div>

            <div class="spot-info">
                投稿日 : ${x["投稿日"]||""}
            </div>

            <div class="spot-info">
                👀 ${x.views||0}
                ❤️ ${x.likes||0}
                💬 ${x.comments||0}
                🔁 ${x.shares||0}
            </div>

            <a class="watch-btn"
               href="${x.URL||'#'}"
               target="_blank">
               TikTokを見る
            </a>

        </div>
        `;
    });

    document.getElementById("list").innerHTML=h;
}

document.getElementById("q").oninput=
e=>draw(e.target.value);

draw();

</script>
